# Mosquitto 2.0: không cho kết nối ẩn danh. Tạo người dùng bằng deployment/scripts/mosquitto-user.ps1 (hoặc .sh).
persistence true
persistence_location /mosquitto/data/
# Backend dùng phiên bền: khi nó vắng mặt (khởi động lại, cập nhật), broker giữ các lô mẫu QoS 1 cho nó.
# 20000 lô = khoảng 5,5 giờ cho 1 thiết bị (1 lô/s), 33 phút cho 10 thiết bị. Mỗi lô khoảng 0,6 KB.
max_queued_messages 20000
log_dest stdout

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS (khi đưa ra Internet): bỏ chú thích, đặt chứng chỉ vào config/certs/ (docs/security.md)
#listener 8883
#allow_anonymous false
#password_file /mosquitto/config/passwd
#acl_file /mosquitto/config/acl
#certfile /mosquitto/config/certs/server.crt
#keyfile /mosquitto/config/certs/server.key
#cafile /mosquitto/config/certs/ca.crt
